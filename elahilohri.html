<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elahi’s Lohri Invitation</title>

<style>
:root { color-scheme: dark; }
body{
  margin:0; padding:16px; min-height:100vh;
  display:grid; place-items:center; gap:12px;
  background:#0b0b0b; color:#fff;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
}
.wrap{ width:min(560px,96vw); display:grid; gap:10px; }
.card{
  background:#121212; border:1px solid rgba(255,255,255,.08);
  border-radius:14px; padding:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  display:grid; gap:10px;
}
canvas{
  width:min(390px,92vw); aspect-ratio:9/16;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.10);
  background:#000;
}
.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.three{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:560px){ .two,.three{ grid-template-columns:1fr; } }
label{ font-size:13px; opacity:.9; }
input, select{ width:100%; background:#1a1a1a; color:#fff;
  border:1px solid rgba(255,255,255,.14);
  border-radius:10px; padding:10px; }
input[type=range]{ accent-color:#f6c65b; }
button{
  width:100%; border:0; border-radius:12px;
  padding:12px; font-weight:800;
  background:#f6c65b; color:#1b1305;
}
button.secondary{
  background:#2a2a2a; color:#fff;
  border:1px solid rgba(255,255,255,.12);
}
button:disabled{ opacity:.55; }
.hint{ font-size:12px; opacity:.75; line-height:1.35; }
.divider{ height:1px; background:rgba(255,255,255,.08); }
</style>
</head>

<body>
<div class="wrap">
<canvas id="c" width="1080" height="1920"></canvas>

<div class="card">

<div class="two">
  <div><label>Background 1</label><input id="bg1" type="file" accept="image/*"></div>
  <div><label>Background 2</label><input id="bg2" type="file" accept="image/*"></div>
</div>

<div class="two">
  <div><label>Background 3</label><input id="bg3" type="file" accept="image/*"></div>
  <div><label>Frame Background</label><input id="bg4" type="file" accept="image/*"></div>
</div>

<div class="two">
  <div><label>Elahi Photo (Front)</label><input id="p1" type="file" accept="image/*"></div>
  <div><label>Elahi Photo (End)</label><input id="p2" type="file" accept="image/*"></div>
</div>

<div class="two">
  <button id="previewBtn" class="secondary">Preview</button>
  <button id="recordBtn" disabled>Record & Download</button>
</div>

<div class="hint">
• Upload all 4 backgrounds  
• Upload Elahi photo for first & last slide  
• Preview → Record → WhatsApp-ready video
</div>

</div>
</div>

<script>
(() => {
const W=1080,H=1920,FPS=30;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

const el={
 bg1:bg1,bg2:bg2,bg3:bg3,bg4:bg4,p1:p1,p2:p2,
 preview:previewBtn, record:recordBtn
};

const TEXT = [
  ["Please Join Us"],
  ["Please join us to celebrate","Elahi’s Lohri"],
  ["Make this occasion more joyful","with your gracious presence"],
  ["28 January 2026","10:00 AM","Thousand Spices"],
  ["An evening of warmth, tradition,","and togetherness"],
  ["See you there"]
];

const imgs={};
async function loadBitmap(f){
 if(!f) return null;
 try{ return await createImageBitmap(f); }
 catch(e){ return null; }
}

async function loadAll(){
 imgs.bg1=await loadBitmap(el.bg1.files[0]);
 imgs.bg2=await loadBitmap(el.bg2.files[0]);
 imgs.bg3=await loadBitmap(el.bg3.files[0]);
 imgs.bg4=await loadBitmap(el.bg4.files[0]);
 imgs.p1=await loadBitmap(el.p1.files[0]);
 imgs.p2=await loadBitmap(el.p2.files[0]);
 el.record.disabled=!(imgs.bg1&&imgs.bg2&&imgs.bg3&&imgs.bg4);
}

function cover(img){
 if(!img) return;
 const s=Math.max(W/img.width,H/img.height);
 ctx.drawImage(img,(W-img.width*s)/2,(H-img.height*s)/2,img.width*s,img.height*s);
}

function drawText(lines,y){
 ctx.save();
 ctx.textAlign="center";
 ctx.fillStyle="#fff";
 ctx.shadowColor="rgba(0,0,0,.6)";
 ctx.shadowBlur=18;
 let size=72;
 lines.forEach((t,i)=>{
  ctx.font=`700 ${size}px Georgia`;
  ctx.fillText(t,W/2,y+i*90);
 });
 ctx.restore();
}

function drawPhoto(photo){
 if(!photo) return;
 const x=190,y=260,w=700,h=1180;
 ctx.save();
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,30);
 ctx.clip();
 const s=Math.max(w/photo.width,h/photo.height);
 ctx.drawImage(photo,x+(w-photo.width*s)/2,y+(h-photo.height*s)/2,photo.width*s,photo.height*s);
 ctx.restore();
}

function drawSlide(i){
 ctx.clearRect(0,0,W,H);
 if(i===0){ cover(imgs.bg4); drawPhoto(imgs.p1); drawText(TEXT[0],H*0.18); }
 if(i===1){ cover(imgs.bg1); drawText(TEXT[1],H*0.35); }
 if(i===2){ cover(imgs.bg1); drawText(TEXT[2],H*0.35); }
 if(i===3){ cover(imgs.bg3); drawText(TEXT[3],H*0.35); }
 if(i===4){ cover(imgs.bg2); drawText(TEXT[4],H*0.35); }
 if(i===5){ cover(imgs.bg4); drawPhoto(imgs.p2); drawText(TEXT[5],H*0.82); }
}

function play(preview,record){
 const dur=4,fade=0.8,total=6;
 let t0=performance.now();
 let rec,stream,chunks=[];
 if(record){
  stream=canvas.captureStream(FPS);
  rec=new MediaRecorder(stream,{mimeType:"video/webm"});
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.start();
 }
 function frame(now){
  const t=(now-t0)/1000;
  const idx=Math.min(Math.floor(t/(dur+fade)),total-1);
  drawSlide(idx);
  if(t<(total*(dur+fade))){
   requestAnimationFrame(frame);
  }else if(record){
   rec.stop();
   rec.onstop=()=>{
    const blob=new Blob(chunks,{type:"video/webm"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="Elahi-Lohri-Invitation.webm";
    a.click();
   };
  }
 }
 requestAnimationFrame(frame);
}

el.preview.onclick=async()=>{ await loadAll(); play(true,false); };
el.record.onclick=async()=>{ await loadAll(); play(false,true); };

})();
</script>
</body>
</html>
